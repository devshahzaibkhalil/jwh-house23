<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login — James Wholesale Homes</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; background: linear-gradient(rgba(15,30,53,.82), rgba(15,30,53,.90)), url("{{ url_for('static', filename='img/welcome/sell-home.webp') }}") center/cover no-repeat fixed; min-height: 100vh; margin:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background: rgba(255,255,255,.98); border-radius: 18px; padding: 34px 40px 40px; width: 380px; box-shadow: 0 24px 70px rgba(0,0,0,0.34); border:1px solid rgba(255,255,255,.32); }
  .brand-image { display:block; width:170px; height:78px; object-fit:contain; margin:0 auto 8px; }
  .logo { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 18px; color: #16243E; text-align: center; margin-bottom: 4px;}
  .logo span { color: #E3562B; }
  .sub { text-align: center; color: #6B7280; font-size: 13px; margin-bottom: 24px; }
  label { font-size: 13px; font-weight: 600; color: #16243E; display:block; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #D9E2EC; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; margin-top: 24px; background: #E3562B; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .flash { background: #FDECEA; color: #B42318; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
  <div class="card">
    <img class="brand-image" src="{{ url_for('static', filename='img/jwh-logo.png') }}" alt="James Wholesale Homes">
    <div class="logo">Secure Administration Portal</div>
    <div class="sub">Administrator Sign In</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email</label>
      <input type="email" name="email" value="{{ email or '' }}" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
